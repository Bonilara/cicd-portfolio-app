name: build-and-push

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/cicd-portfolio-app
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Trivy image scan (fail on high/critical)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push to ACR
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "$IMAGE:${{ github.sha }}"
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Set up Notation
        if: github.ref == 'refs/heads/main'
        uses: notaryproject/notation-action/setup@v1

      - name: Sign image digest
        if: false
        uses: notaryproject/notation-action/sign@v1
        with:
          plugin_name: azure-kv
          plugin_url: https://github.com/Azure/notation-azure-kv/releases/download/v1.2.1/notation-azure-kv_1.2.1_linux_amd64.tar.gz
          plugin_checksum: 67c5ccaaf28dd44d2b6572684d84e344a02c2258af1d65ead3910b3156d3eaf5
          key_id: ${{ vars.SIGNING_KEY_ID }}
          target_artifact_reference: ${{ steps.push.outputs.image_ref }}
          signature_format: cose
          plugin_config: |-
            self_signed=true
            credential_type=azurecli

  deploy: #test deployment
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Notation
        uses: notaryproject/notation-action/setup@v1

      - name: Verify signature (gate)
        uses: notaryproject/notation-action/verify@v1
        with:
          target_artifact_reference: ${{ needs.image.outputs.image_ref }}
          trust_policy: .github/trustpolicy/trustpolicy.json
          trust_store: .github/truststore

      - name: Deploy new revision
        env:
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update -n ca-cicd-portfolio -g rg-cicd-portfolio --image "$IMAGE_REF"

      - name: Show active revision
        run: |
          az containerapp revision list -n ca-cicd-portfolio -g rg-cicd-portfolio \
            --query "[?properties.active].{name:name,health:properties.healthState,image:properties.template.containers[0].image}" \
            -o table